name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build source and wheel distributions
        run: |
          python -m pip install build==1.6.1
          python -m build --sdist --wheel .
      - name: Check the tag against the package version
        run: python -c "import os, sys; sys.path.insert(0, 'src'); from release_proof_mcp.version import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__, (__version__, os.environ['GITHUB_REF_NAME'])"
      - name: Attest distribution build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          push-to-registry: false
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Release Proof MCP $GITHUB_REF_NAME" --generate-notes
