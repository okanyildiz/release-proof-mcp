[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "release-proof-mcp"
dynamic = ["version"]
description = "Read-only GitHub Actions, GHCR, and Kubernetes release evidence over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "release-proof-mcp contributors"}]
dependencies = ["cryptography==50.0.2", "jsonschema==4.26.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
release-proof-mcp = "release_proof_mcp.server:main"
release-proof-verify = "release_proof_mcp.consumer_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "release_proof_mcp.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
release_proof_mcp = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: opt-in integration test using configured real infrastructure"]
